# ci.yml — 单元测试 + Debug APK 远程编译
# - push/PR：跑单元测试（全 mock，零 API 消耗）→ 通过后编译 APK 并上传产物
# - 打 tag（v*）：测试 + 编译 + 自动建 Release 挂 APK（公开仓库即为永久直链，手机可直接下载安装）
# - 手动触发：Actions 页面 Run workflow 按钮
# 注意：本仓库不含任何密钥（内置 Key 已移除），CI 无需配置 Secrets
name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 单元测试（全 mock）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 门禁：android assets 目录未入库（gitignore），全新 checkout 不存在 —— 先 sync 生成，
      # 再校验版本号一致性，最后用 git diff 把关已提交的 www/ 副本与 js/ 源一致（改源未同步即失败）
      - name: 三目录同步校验
        run: |
          node scripts/sync-web.mjs
          node scripts/sync-android-version.mjs --check
          git diff --exit-code -- www/ || { echo '✗ www/ 与 js/ 不同步：请本地运行 npm run sync 后提交'; exit 1; }

      - name: 单元测试
        run: node --test test/*.test.js

  build-apk:
    name: 编译 Debug APK
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 构建前同步：www/ 与 android assets 从 js/ 生成，build.gradle 版本号取 package.json
      - name: 三目录同步
        run: |
          node scripts/sync-web.mjs
          node scripts/sync-android-version.mjs

      # capacitor-cordova-android-plugins 模块被 android/.gitignore 忽略（本地由 cap sync 生成），
      # 全新 checkout 需先运行 Capacitor 同步生成该模块，并刷新 android assets 里的 web 资源
      - name: Capacitor 同步（生成 cordova 插件模块）
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # 项目 gradle.properties 的 jvmargs 带 Windows 专用 -Djava.io.tmpdir=C:/...，
      # 用户级 gradle.properties 优先级更高，用干净值覆盖以适配 Linux
      - name: 覆盖 Windows 专用 Gradle 参数
        run: |
          mkdir -p ~/.gradle
          printf 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\n' >> ~/.gradle/gradle.properties

      # 注入本机 debug.keystore（加密 Secret），使 CI 产物与本地构建同签名 —
      # 已装的本地构建包可直接覆盖升级、不丢数据；缺失时 AGP 会临时生成（导致签名冲突）
      - name: 注入签名密钥
        run: |
          mkdir -p ~/.android
          printf '%s' '${{ secrets.DEBUG_KEYSTORE }}' | base64 -d > ~/.android/debug.keystore

      - name: Gradle 编译 APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: qingban-debug-apk
          path: android/build-output/app/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 打 v* 标签时自动发布 Release，APK 作为附件
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/build-output/app/outputs/apk/debug/*.apk
          generate_release_notes: true
