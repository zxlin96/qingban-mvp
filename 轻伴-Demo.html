<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>轻伴 - AI减重陪伴助手</title>
<style>
/* ==================== CSS Variables ==================== */
:root {
  --bg: #0f1117;
  --bg2: #181b24;
  --bg3: #1f2330;
  --bg4: #262a38;
  --accent: #6ee7a3;
  --accent-dim: #4ab87e;
  --accent-glow: rgba(110, 231, 163, 0.15);
  --text: #e4e6eb;
  --text-dim: #8b8f9a;
  --text-dimmer: #5a5e6a;
  --border: #2a2d3a;
  --border-light: #353948;
  --danger: #f87171;
  --warning: #fbbf24;
  --info: #60a5fa;
  --purple: #c084fc;
  --user-bubble: rgba(110, 231, 163, 0.10);
  --assistant-bubble: #1f2330;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --radius: 10px;
  --mono: 'SF Mono','Cascadia Code','Consolas','Liberation Mono',monospace;
  --sans: -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
}
[data-theme="light"] {
  --bg: #f5f6f8;
  --bg2: #ffffff;
  --bg3: #ebedf0;
  --bg4: #e0e2e8;
  --accent: #1a9c5f;
  --accent-dim: #157a48;
  --accent-glow: rgba(26,156,95,0.10);
  --text: #1a1d24;
  --text-dim: #6b7280;
  --text-dimmer: #9ca3af;
  --border: #d1d5db;
  --border-light: #e5e7eb;
  --user-bubble: rgba(26,156,95,0.08);
  --assistant-bubble: #f0f1f3;
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
}
[data-theme="warm"] {
  --bg: #1a1410;
  --bg2: #241c16;
  --bg3: #2e241d;
  --bg4: #3a2e24;
  --accent: #f0a050;
  --accent-dim: #c08030;
  --accent-glow: rgba(240,160,80,0.12);
  --text: #f0e0d0;
  --text-dim: #a09080;
  --text-dimmer: #706050;
  --border: #3a2e24;
  --border-light: #4a3e34;
  --user-bubble: rgba(240,160,80,0.08);
  --assistant-bubble: #2e241d;
  --shadow: 0 4px 24px rgba(0,0,0,0.5);
}

/* ==================== Reset & Base ==================== */
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-light); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-dimmer); }

/* ==================== Top Bar ==================== */
.topbar {
  height: 56px;
  display: flex;
  align-items: center;
  padding: 0 16px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  gap: 12px;
  position: relative;
  z-index: 100;
}
.topbar-left { display:flex; align-items:center; gap:10px; flex-shrink:0; }
.logo {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), var(--accent-dim));
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 700;
  color: #0f1117;
  box-shadow: 0 0 20px var(--accent-glow);
}
.app-name { font-size:16px; font-weight:600; white-space:nowrap; }
.app-sub { font-size:11px; color:var(--text-dim); font-weight:400; margin-left:4px; }

.topbar-center { flex:1; display:flex; align-items:center; justify-content:center; min-width:0; }
.token-bar-wrap { display:flex; align-items:center; gap:8px; background:var(--bg); border:1px solid var(--border); border-radius:20px; padding:4px 12px; }
.token-bar-label { font-size:11px; color:var(--text-dim); white-space:nowrap; }
.token-bar-track { width:120px; height:6px; background:var(--bg3); border-radius:3px; overflow:hidden; }
.token-bar-fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-dim)); border-radius:3px; transition:width .5s; }
.token-bar-num { font-size:11px; color:var(--accent); font-family:var(--mono); white-space:nowrap; }

.topbar-right { display:flex; align-items:center; gap:8px; flex-shrink:0; }
.date-badge {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px 10px;
  font-size: 12px;
  font-family: var(--mono);
  color: var(--text-dim);
}
.btn-icon {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 12px;
  color: var(--text-dim);
  cursor: pointer;
  transition: all .2s;
  font-family: var(--sans);
  white-space: nowrap;
}
.btn-icon:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-glow); }
.btn-icon.active { border-color:var(--accent); color:var(--accent); background:var(--accent-glow); }

/* ==================== Main Layout ==================== */
.main {
  display: flex;
  height: calc(100% - 56px);
  overflow: hidden;
}
.panel-left, .panel-right {
  width: 260px;
  flex-shrink: 0;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
}
.panel-right { border-right:none; border-left:1px solid var(--border); }
.panel-center {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--bg);
}
.panel-header {
  padding: 12px 16px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.panel-header .dot { width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 6px var(--accent); }

/* ==================== File Tree ==================== */
.file-tree { padding:8px; overflow-y:auto; flex:1; }
.file-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 8px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text);
  transition: background .15s;
  user-select: none;
}
.file-item:hover { background: var(--bg3); }
.file-item.active { background: var(--accent-glow); color: var(--accent); }
.file-item .indent { width: 16px; flex-shrink:0; }
.file-item svg { flex-shrink:0; opacity:0.7; }
.file-item.active svg { opacity:1; color:var(--accent); }
.file-item .file-name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.folder-arrow { width:12px; display:inline-block; text-align:center; font-size:10px; color:var(--text-dim); transition: transform .2s; }
.folder-arrow.open { transform: rotate(90deg); }
.file-children { overflow:hidden; }

/* ==================== Chat ==================== */
.chat-header {
  padding: 10px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg2);
}
.chat-header-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg,var(--accent),var(--accent-dim));
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: var(--bg);
}
.chat-header-info { flex:1; }
.chat-header-name { font-size:14px; font-weight:600; }
.chat-header-status { font-size:11px; color:var(--accent); display:flex; align-items:center; gap:4px; }
.chat-header-status::before { content:''; width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 4px var(--accent); }

.chat-messages { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:16px; }

.msg { display:flex; gap:10px; max-width:80%; animation: msgIn .3s ease; }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg-avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600;
  flex-shrink: 0;
}
.msg.assistant .msg-avatar { background: var(--bg3); border:1px solid var(--border); color:var(--accent); }
.msg.user .msg-avatar { background: var(--accent); color: var(--bg); }
.msg-body { display:flex; flex-direction:column; gap:6px; min-width:0; }
.msg-bubble {
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 14px;
  word-break: break-word;
}
.msg.assistant .msg-bubble {
  background: var(--assistant-bubble);
  border: 1px solid var(--border);
  border-top-left-radius: 4px;
}
.msg.user .msg-bubble {
  background: var(--user-bubble);
  border: 1px solid var(--accent);
  border-top-right-radius: 4px;
}
.msg-bubble strong { color: var(--accent); }
.msg-bubble .food-line { display:flex; align-items:flex-start; gap:6px; margin:4px 0; }
.msg-bubble .food-line::before { content:'•'; color:var(--accent); flex-shrink:0; }
.msg-time { font-size:11px; color:var(--text-dimmer); padding:0 4px; }
.msg.user .msg-time { text-align:right; }

/* Tool call badges */
.tool-badges { display:flex; flex-direction:column; gap:4px; margin-top:6px; }
.tool-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 11px;
  font-family: var(--mono);
  color: var(--text-dim);
  animation: badgeIn .4s ease;
}
.tool-badge .tool-name { color: var(--info); }
.tool-badge .tool-file { color: var(--accent); }
.tool-badge .tool-status {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--warning);
  animation: pulse 1s infinite;
}
.tool-badge.done .tool-status { background: var(--accent); animation:none; }
.tool-badge .tool-icon { font-size:10px; }

/* Typing indicator */
.typing-indicator { display:flex; gap:4px; padding:12px 14px; background:var(--assistant-bubble); border:1px solid var(--border); border-radius:12px; border-top-left-radius:4px; }
.typing-dot { width:7px; height:7px; border-radius:50%; background:var(--text-dim); animation: typingBounce 1.4s infinite; }
.typing-dot:nth-child(2) { animation-delay:0.2s; }
.typing-dot:nth-child(3) { animation-delay:0.4s; }

/* ==================== Chat Input ==================== */
.chat-input-area {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  background: var(--bg2);
  display: flex;
  gap: 8px;
  align-items: flex-end;
}
.chat-input-wrap { flex:1; position:relative; }
.chat-input {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 40px 10px 14px;
  color: var(--text);
  font-size: 14px;
  font-family: var(--sans);
  resize: none;
  outline: none;
  transition: border-color .2s;
  max-height: 120px;
  line-height: 1.5;
}
.chat-input:focus { border-color: var(--accent); }
.chat-input::placeholder { color: var(--text-dimmer); }
.photo-btn {
  position: absolute;
  right: 8px;
  bottom: 8px;
  background: transparent;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  padding: 4px;
  border-radius: 6px;
  transition: all .2s;
}
.photo-btn:hover { color: var(--accent); background: var(--accent-glow); }
.send-btn {
  background: var(--accent);
  color: var(--bg);
  border: none;
  border-radius: 10px;
  padding: 10px 16px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
  flex-shrink: 0;
}
.send-btn:hover { background: var(--accent-dim); transform: translateY(-1px); }
.send-btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }

/* ==================== Tool Log ==================== */
.tool-log { padding:8px; overflow-y:auto; flex:1; }
.tool-log-entry {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  margin-bottom: 6px;
  font-size: 12px;
  animation: msgIn .3s ease;
}
.tool-log-entry .tle-head { display:flex; align-items:center; gap:6px; }
.tool-log-entry .tle-time { font-family:var(--mono); color:var(--text-dimmer); font-size:10px; }
.tool-log-entry .tle-tool {
  font-family: var(--mono);
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 4px;
}
.tool-log-entry .tle-tool.read { background: rgba(96,165,250,0.15); color: var(--info); }
.tool-log-entry .tle-tool.write { background: rgba(110,231,163,0.15); color: var(--accent); }
.tool-log-entry .tle-tool.list { background: rgba(192,132,252,0.15); color: var(--purple); }
.tool-log-entry .tle-target { color: var(--text-dim); font-family:var(--mono); font-size:11px; margin-top:2px; }
.tool-log-entry .tle-status { margin-left:auto; font-size:10px; }
.tool-log-entry .tle-status.success { color: var(--accent); }
.tool-log-entry .tle-status.running { color: var(--warning); }

/* ==================== Modals ==================== */
.modal-overlay {
  position: fixed;
  top:0; left:0; right:0; bottom:0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.show { display:flex; animation: fadeIn .2s ease; }
.modal {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 14px;
  width: 100%;
  max-width: 680px;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow);
  animation: modalIn .3s ease;
}
.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-title { font-size:15px; font-weight:600; display:flex; align-items:center; gap:8px; }
.modal-title .modal-icon { color: var(--accent); }
.modal-close {
  background: transparent;
  border: none;
  color: var(--text-dim);
  font-size: 22px;
  cursor: pointer;
  padding: 0 4px;
  line-height: 1;
}
.modal-close:hover { color: var(--danger); }
.modal-body { padding:20px; overflow-y:auto; flex:1; }

/* File viewer */
.file-viewer-meta { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
.file-meta-tag {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 4px;
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text-dim);
}
.file-viewer-content {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.7;
  white-space: pre-wrap;
  color: var(--text);
  overflow-x: auto;
}
.file-viewer-content .md-h1 { color: var(--accent); font-size:16px; font-weight:700; }
.file-viewer-content .md-h2 { color: var(--text); font-size:14px; font-weight:600; margin-top:8px; }
.file-viewer-content .md-table { border-collapse:collapse; width:100%; margin:8px 0; }
.file-viewer-content .md-table th, .file-viewer-content .md-table td { border:1px solid var(--border); padding:4px 8px; font-size:12px; }
.file-viewer-content .md-table th { background:var(--bg3); }
.file-viewer-content .md-bold { color:var(--accent); }
.file-viewer-content .md-hr { border:none; border-top:1px solid var(--border); margin:8px 0; }
.file-viewer-content .md-li { display:block; padding-left:8px; }

/* Memory panel */
.memory-section { margin-bottom:20px; }
.memory-section-title {
  font-size:13px; font-weight:600; color:var(--accent);
  margin-bottom:6px; display:flex; align-items:center; gap:6px;
}
.memory-section-content {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.7;
  white-space: pre-wrap;
  color: var(--text-dim);
  max-height: 240px;
  overflow-y: auto;
}
.memory-intro {
  background: var(--accent-glow);
  border: 1px solid var(--accent);
  border-radius: 10px;
  padding: 12px 16px;
  margin-bottom: 16px;
  font-size: 13px;
  color: var(--text);
  line-height: 1.6;
}
.memory-intro strong { color: var(--accent); }

/* ==================== Day Transition Overlay ==================== */
.day-transition {
  position: fixed;
  top:0; left:0; right:0; bottom:0;
  background: linear-gradient(180deg, #0a0c14 0%, #121522 50%, #0a0c14 100%);
  z-index: 300;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 24px;
}
.day-transition.show { display:flex; animation: fadeIn .5s ease; }
.dt-moon-wrap { position: relative; width: 80px; height: 80px; }
.dt-moon {
  width: 80px; height: 80px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #f5f5f0, #c8c8c0);
  box-shadow: 0 0 40px rgba(200,200,190,0.4), inset -8px -8px 20px rgba(0,0,0,0.2);
  animation: moonPulse 2.5s ease-in-out infinite;
}
.dt-moon-glow {
  position: absolute;
  top: -10px; left: -10px;
  width: 100px; height: 100px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(110,231,163,0.15), transparent 70%);
  animation: glowPulse 2.5s ease-in-out infinite;
}
.dt-title { font-size: 18px; color: #e4e6eb; font-weight: 600; }
.dt-progress-wrap { width: 320px; max-width: 80vw; }
.dt-progress-track { width:100%; height:4px; background:rgba(255,255,255,0.1); border-radius:2px; overflow:hidden; }
.dt-progress-fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-dim)); border-radius:2px; width:0%; transition:width .8s ease; }
.dt-steps { display:flex; flex-direction:column; gap:10px; width:320px; max-width:80vw; margin-top:8px; }
.dt-step {
  display: flex; align-items: center; gap: 10px;
  font-size: 13px; color: var(--text-dim);
  opacity: 0.4;
  transition: opacity .3s;
}
.dt-step.active { opacity: 1; }
.dt-step.done { opacity: 0.8; }
.dt-step-dot {
  width: 16px; height: 16px;
  border-radius: 50%;
  border: 2px solid var(--text-dimmer);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all .3s;
}
.dt-step.active .dt-step-dot { border-color: var(--warning); }
.dt-step.active .dt-step-dot::after { content:''; width:6px; height:6px; border-radius:50%; background:var(--warning); animation: pulse 1s infinite; }
.dt-step.done .dt-step-dot { background: var(--accent); border-color: var(--accent); }
.dt-step.done .dt-step-dot::after { content:'✓'; color:#0f1117; font-size:10px; font-weight:700; }
.dt-complete-btn {
  background: var(--accent);
  color: #0f1117;
  border: none;
  border-radius: 10px;
  padding: 10px 28px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  display: none;
  transition: all .2s;
}
.dt-complete-btn.show { display:block; animation: msgIn .4s ease; }
.dt-complete-btn:hover { background: var(--accent-dim); }

/* ==================== Animations ==================== */
@keyframes msgIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
@keyframes badgeIn { from { opacity:0; transform: translateY(-4px); } to { opacity:1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
@keyframes modalIn { from { opacity:0; transform: scale(0.96) translateY(8px); } to { opacity:1; transform: scale(1) translateY(0); } }
@keyframes typingBounce { 0%,60%,100% { transform: translateY(0); opacity:0.4; } 30% { transform: translateY(-6px); opacity:1; } }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
@keyframes moonPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
@keyframes glowPulse { 0%,100% { opacity:0.6; transform: scale(1); } 50% { opacity:1; transform: scale(1.15); } }

/* ==================== Mobile ==================== */
.mobile-tabs { display:none; }
@media (max-width: 900px) {
  .panel-left { display:none; }
  .panel-right { display:none; }
  .app-sub { display:none; }
  .token-bar-wrap { padding:3px 8px; }
  .token-bar-track { width:60px; }
  .mobile-tabs {
    display:flex;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--bg2);
    border-top: 1px solid var(--border);
    z-index: 150;
    height: 48px;
  }
  .mobile-tab {
    flex:1;
    background:none; border:none;
    color: var(--text-dim);
    font-size: 11px;
    cursor: pointer;

// ==================== Markdown Formatter ====================
function formatMarkdown(text) {
  let html = text;
  // Headers
  html = html.replace(/^### (.+)$/gm, '<span class="md-h2">$1</span>');
  html = html.replace(/^## (.+)$/gm, '<span class="md-h2">$1</span>');
  html = html.replace(/^# (.+)$/gm, '<span class="md-h1">$1</span>');
  // Bold
  html = html.replace(/\*\*(.+?)\*\*/g, '<span class="md-bold">$1</span>');
  // HR
  html = html.replace(/^---$/gm, '<hr class="md-hr">');
  // List items
  html = html.replace(/^- (.+)$/gm, '<span class="md-li">• $1</span>');
  // Line breaks
  html = html.replace(/\n/g, '<br>');
  // Clean up extra brs around block elements
  html = html.replace(/(<br>)?(<span class="md-h[12]">)/g, '$2');
  html = html.replace(/(<span class="md-h[12]">[^<]*<\/span>)(<br>)?(<br>)?/g, '$1<br><br>');
  return html;
}

function formatMdForChat(text) {
  let html = text;
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\n/g, '<br>');
  return html;
}

    folderEl.insertAdjacentHTML('beforeend', ICONS.folder);
    const name = document.createElement('span');
    name.className = 'file-name';
    name.textContent = node.name;
    folderEl.appendChild(name);
    const childWrap = document.createElement('div');
    childWrap.className = 'file-children';
    node.children.forEach(child => {
      childWrap.appendChild(buildTreeNode(child, depth + 1));
    });
    folderEl.onclick = () => {
      arrow.classList.toggle('open');
      childWrap.style.display = childWrap.style.display === 'none' ? 'block' : 'none';
    };
    wrap.appendChild(folderEl);
    wrap.appendChild(childWrap);
  } else {
    const fileEl = document.createElement('div');
    fileEl.className = 'file-item';
    fileEl.style.paddingLeft = (8 + depth * 16) + 'px';
    const spacer = document.createElement('span');
    spacer.className = 'indent';
    spacer.style.width = '12px';
    fileEl.appendChild(spacer);
    fileEl.insertAdjacentHTML('beforeend', ICONS.file);
    const name = document.createElement('span');
    name.className = 'file-name';
    name.textContent = node.name;
    fileEl.appendChild(name);
    fileEl.onclick = () => {
      document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
      fileEl.classList.add('active');
      openFileViewer(node.path);
    };
    wrap.appendChild(fileEl);
  }
  return wrap;
}

function generateWeightResponse(text) {
  // Extract weight number
  const match = text.match(/(\d+\.?\d*)\s*(?:公斤|kg|斤)/);
  let weight = 81.5;
  let isJin = false;
  if (match) {
    weight = parseFloat(match[1]);
    if (text.includes('斤') && !text.includes('公斤') && !text.includes('kg')) {
      weight = weight / 2;
      isJin = true;
    }
  }
  const height = 1.75;
  const bmi = (weight / (height * height)).toFixed(1);
  const prevWeight = 81.8;
  const change = (weight - prevWeight).toFixed(1);
  const changeStr = change <= 0 ? `**${change} kg** （下降）` : `**+${change} kg** （上升）`;
  const totalChange = (weight - 82.0).toFixed(1);
  const isGood = change <= 0;

  let content = `体重已更新！

**体重追踪：**
- 当前：**${weight} kg**
- BMI：**${bmi}**
- 较上次（${prevWeight}kg）：${changeStr}
- 总减重：82.0 → ${weight} = **${totalChange} kg**

${isGood ? '继续保持！稳步下降是最好的节奏。' : '体重有波动很正常，可能跟水分、饮食时间有关，不用太焦虑，看长期趋势就好。'}按当前进度，距离目标 ${Math.abs(72 - weight).toFixed(1)} kg，加油！`;

  return {
    content,
    toolCalls: [
      { tool:'read_file', file:'BODY_METRICS.md', status:'done' },
      { tool:'write_file', file:'BODY_METRICS.md', status:'done' },
    ],
    tokenCost: 200
  };
}

function getCurrentTime() {
  const now = new Date();
  return String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
}

function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || isResponding) return;

  isResponding = true;

  // Add user message
  const userMsg = {
    role: 'user',
    content: text,
    time: getCurrentTime()
  };
  const container = document.getElementById('chatMessages');
  container.appendChild(buildMessageEl(userMsg));
  container.scrollTop = container.scrollHeight;

  input.value = '';
  input.style.height = 'auto';

  // Show typing
  setTimeout(() => {
    showTypingIndicator();
  }, 300);

  // Generate response
  const response = getMockResponse(text);
  const delay = 1200 + Math.random() * 800;

  setTimeout(() => {
    removeTypingIndicator();

    // Add tool call entries first (simulate tool execution)
    if (response.toolCalls.length > 0) {
      response.toolCalls.forEach((tc, i) => {
        setTimeout(() => {
          addToolLogEntry(tc.tool, tc.file);
        }, i * 300);
      });
    }

    // Add assistant message
    const assistantMsg = {
      role: 'assistant',
      content: response.content,
      toolCalls: response.toolCalls,
      time: getCurrentTime()
    };
    container.appendChild(buildMessageEl(assistantMsg));
    container.scrollTop = container.scrollHeight;

    updateTokenBar(response.tokenCost || 150);
    isResponding = false;
  }, delay);
}

function startDayTransition() {
  const overlay = document.getElementById('dayTransition');
  overlay.classList.add('show');
  const stepsContainer = document.getElementById('dtSteps');
  stepsContainer.innerHTML = '';
  const progressFill = document.getElementById('dtProgress');
  progressFill.style.width = '0%';
  const completeBtn = document.getElementById('dtCompleteBtn');
  completeBtn.classList.remove('show');

  DT_STEPS.forEach((step, i) => {
    const el = document.createElement('div');
    el.className = 'dt-step';
    el.id = 'dtStep' + i;
    el.innerHTML = `
      <div class="dt-step-dot"></div>
      <div>
        <div>${step.text}</div>
        <div style="font-size:11px;color:var(--text-dimmer);font-family:var(--mono);">${step.detail}</div>
      </div>
    `;
    stepsContainer.appendChild(el);
  });

  // Animate steps
  DT_STEPS.forEach((step, i) => {
    setTimeout(() => {
      const el = document.getElementById('dtStep' + i);
      if (el) {
        el.classList.add('active');
        progressFill.style.width = ((i + 1) / DT_STEPS.length * 100) + '%';
      }
    }, 800 + i * 1200);

    setTimeout(() => {
      const el = document.getElementById('dtStep' + i);
      if (el) {
        el.classList.remove('active');
        el.classList.add('done');
      }
      if (i === DT_STEPS.length - 1) {
        setTimeout(() => {
          completeBtn.classList.add('show');
        }, 500);
      }
    }, 800 + i * 1200 + 900);
  });
}

function closeDayTransition() {
  document.getElementById('dayTransition').classList.remove('show');
}

// ==================== Theme Toggle ====================
const themes = ['dark', 'light', 'warm'];
const themeLabels = { dark: '深色', light: '浅色', warm: '暖色' };
let currentThemeIdx = 0;

function toggleTheme() {
  currentThemeIdx = (currentThemeIdx + 1) % themes.length;
  const theme = themes[currentThemeIdx];
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('themeBtn');
  btn.textContent = themeLabels[theme];
  btn.classList.add('active');
  setTimeout(() => btn.classList.remove('active'), 1000);
}

// ==================== Mobile Tab Switching ====================
function switchMobileTab(tab) {
  document.querySelectorAll('.mobile-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.mobile-tab[data-tab="${tab}"]`).classList.add('active');

  const left = document.getElementById('panelLeft');
  const center = document.getElementById('panelCenter');
  const right = document.getElementById('panelRight');

  left.classList.remove('mobile-show');
  right.classList.remove('mobile-show');
  center.classList.remove('mobile-hide');

  if (tab === 'files') {
    left.classList.add('mobile-show');
    center.classList.add('mobile-hide');
  } else if (tab === 'tools') {
    right.classList.add('mobile-show');
    center.classList.add('mobile-hide');
  }
}

// ==================== Auto-resize textarea ====================
function setupInput() {
  const input = document.getElementById('chatInput');
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
}

// ==================== Initialize ====================
function init() {
  renderFileTree();
  renderMessages();
  renderToolLog();
  setupInput();
}

init();
